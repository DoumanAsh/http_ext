[package]
name = "http_ext"
version = "1.0.1"
edition = "2024"
rust-version = "1.85"
description = "Extensions to provide useful utilities for http crate"
readme = "README.md"
repository = "https://github.com/DoumanAsh/http_ext"
license = "BSL-1.0"
keywords = ["http"]
categories = ["web-programming"]
include = [
    "**/*.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE"
]

[dependencies.http]
version = "1"
default-features = false
features = ["std"]

[dependencies.http-body]
version = "1"
default-features = false
optional = true

[dependencies.bytes]
version = "1"
default-features = false

[dependencies.serde]
version = "1"
default-features = false
features = ["alloc"]

[dependencies.ryu]
version = "1"
default-features = false

[dependencies.itoa]
version = "1"
default-features = false

[dependencies.compu]
version = "2.0.1"
default-features = false
features = ["zstd", "zlib-rust"]

[dependencies.percent-encoding]
version = "2"
default-features = false

[dev-dependencies.thread-waker]
version = "1"

[features]
std = []
http-body = ["dep:http-body"]

[package.metadata.docs.rs]
features = ["std", "http-body"]
